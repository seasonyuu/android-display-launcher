name: Tagged Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release tag on main history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - name: Validate tag and release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew versionInfo --no-configuration-cache
          python3 scripts/ci/release.py validate
      - name: Test and lint
        run: |
          ./gradlew -p buildSrc test --no-configuration-cache
          ./gradlew :app:testDebugUnitTest :app:lintRelease --no-configuration-cache
      - name: Prepare signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: scripts/ci/prepare-signing.sh
      - name: Build and verify signed Release
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew versionInfo :app:assembleRelease --no-configuration-cache
          python3 scripts/ci/package-apk.py --variant release
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release.py publish
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checks-${{ github.ref_name }}
          path: |
            app/build/reports/
            buildSrc/build/reports/
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/display-launcher-signing"
